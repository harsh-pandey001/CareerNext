# CareerNext — Nginx reverse proxy (activated in V3 for staging).
# Routes web traffic to Next.js and /graphql to the NestJS API.

user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;

  upstream careernext_web {
    server web:3000;
  }

  upstream careernext_api {
    server api:4000;
  }

  server {
    listen 80;
    server_name _;

    # GraphQL API
    location /graphql {
      proxy_pass http://careernext_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web application
    location / {
      proxy_pass http://careernext_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
