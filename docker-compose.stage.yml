# CareerNext — Staging environment (AWS EC2 + Nginx).
# Activated in V3. On AWS, PostgreSQL is provided by RDS (managed) rather than a
# container — set DATABASE_URL via deploy secrets. Nginx fronts web + api.
name: careernext-stage

services:
  api:
    image: careernext/api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
    expose:
      - "4000"

  web:
    image: careernext/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: staging
      NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${NEXT_PUBLIC_GRAPHQL_ENDPOINT}
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
