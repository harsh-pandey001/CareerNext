# CareerNext — Continuous Integration.
# Runs on every push/PR: Lint -> Typecheck -> Test -> Build (Turborepo pipeline).
name: CI

on:
  push:
    branches: [Dev, stg, prod]
  pull_request:
    branches: [Dev, stg, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    env:
      # Placeholder only — `prisma generate` (run via apps/api's postinstall
      # hook) needs DATABASE_URL to be defined to parse the schema's
      # datasource block, but it never connects to a real database.
      DATABASE_URL: postgresql://careernext:careernext@localhost:5432/careernext?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
